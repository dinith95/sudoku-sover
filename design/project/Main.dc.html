<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sudoku board with candidates</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
body{margin:0;background:#111214;font-family:Inter,sans-serif}
</style>
</helmet>
<div style="width: 1000px; height: 680px; box-sizing: border-box; padding: 48px; background: #111214; color: #eceae6; display: flex; gap: 40px; align-items: flex-start">
  <div style="width: 566px; flex: none; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 36px; font-weight: 700; letter-spacing: -0.03em">Sudoku</h1>
      <p style="margin: 0; font-size: 15px; color: #a1a19b">Suitable numbers show in every empty cell.</p>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; padding: 3px; background: #55585f; border-radius: 14px; overflow: hidden">
      <sc-for list="{{boxes}}" as="box" hint-placeholder-count="9">
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: #2a2c31">
          <sc-for list="{{box.cells}}" as="c" hint-placeholder-count="9">
            <div style="aspect-ratio: 1; display: flex; align-items: center; justify-content: center; background: {{c.bg}}; box-shadow: {{c.ring}}">
              <sc-if value="{{c.filled}}" hint-placeholder-val="{{ false }}">
                <span style="font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: {{c.weight}}; color: #eceae6">{{c.digit}}</span>
              </sc-if>
              <sc-if value="{{c.few}}" hint-placeholder-val="{{ false }}">
                <span style="font-family: Inter, sans-serif; font-size: {{c.candSize}}; font-weight: {{c.candWeight}}; font-variant-numeric: tabular-nums; letter-spacing: 0.06em; color: {{c.candColor}}">{{c.cands}}</span>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 24px; padding-top: 4px">
    <h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #a1a19b">How a cell reads</h2>
    <div style="display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; align-items: center; gap: 16px">
        <div style="width: 64px; height: 64px; flex: none; display: flex; align-items: center; justify-content: center; background: #17181b; border: 1px solid #2a2c31"><span style="font-size: 16px; font-weight: 600; letter-spacing: 0.06em; color: #a1a19b">2 5</span></div>
        <p style="margin: 0; font-size: 14px; line-height: 20px; color: #c9c7c2">One or two numbers fit: they are listed.</p>
      </div>
      <div style="display: flex; align-items: center; gap: 16px">
        <div style="width: 64px; height: 64px; flex: none; display: flex; align-items: center; justify-content: center; background: #17181b; border: 1px solid #2a2c31"></div>
        <p style="margin: 0; font-size: 14px; line-height: 20px; color: #c9c7c2">Three or more fit: the cell stays blank.</p>
      </div>
      <div style="display: flex; align-items: center; gap: 16px">
        <div style="width: 64px; height: 64px; flex: none; display: flex; align-items: center; justify-content: center; background: #17181b; border: 1px solid #2a2c31"><span style="font-size: 28px; font-weight: 700; color: #8fa2ff">7</span></div>
        <p style="margin: 0; font-size: 14px; line-height: 20px; color: #c9c7c2">Only one fits: it turns blue and larger, so you can spot it.</p>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 12px; background: #1a1b1e">
      <p style="margin: 0; display: flex; justify-content: space-between; font-size: 14px; color: #c9c7c2"><span>Given</span><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: #eceae6">5</span></p>
      <p style="margin: 0; display: flex; justify-content: space-between; font-size: 14px; color: #c9c7c2"><span>Suitable numbers</span><span style="font-weight: 600; color: #a1a19b">2 5</span></p>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1000,"height":680}}'>
class Component extends DCLogic {
  renderVals() {
    const P = '530070000600195000098000060800060003400803001700020006060000280000419005000080079';
    const g = P.split('').map(Number);
    const sel = 37;
    const fits = (i, v) => {
      const r = Math.floor(i / 9), c = i % 9;
      for (let k = 0; k < 9; k++) {
        if (g[r * 9 + k] === v || g[k * 9 + c] === v) return false;
      }
      const br = r - (r % 3), bc = c - (c % 3);
      for (let y = 0; y < 3; y++) for (let x = 0; x < 3; x++) {
        if (g[(br + y) * 9 + bc + x] === v) return false;
      }
      return true;
    };
    const boxOf = (i) => Math.floor(i / 27) * 3 + Math.floor((i % 9) / 3);
    const cell = (i) => {
      const filled = g[i] !== 0;
      const cands = [];
      if (!filled) for (let v = 1; v <= 9; v++) if (fits(i, v)) cands.push(v);
      const peer = i !== sel && (Math.floor(i / 9) === Math.floor(sel / 9) || i % 9 === sel % 9 || boxOf(i) === boxOf(sel));
      return {
        filled,
        digit: g[i],
        weight: 700,
        few: !filled && cands.length >= 1 && cands.length <= 2,
        cands: cands.join(' '),
        candSize: cands.length === 1 ? '28px' : '16px',
        candWeight: cands.length === 1 ? 700 : 600,
        candColor:cands.length === 1 ? '#8fa2ff' : '#a1a19b',
        bg: i === sel ? 'rgba(143,162,255,0.3)' : peer ? '#202229' : '#17181b',
        ring: i === sel ? 'inset 0 0 0 2px #8fa2ff' : 'none',
      };
    };
    const boxes = [];
    for (let b = 0; b < 9; b++) {
      const cells = [];
      for (let k = 0; k < 9; k++) {
        const i = (Math.floor(b / 3) * 3 + Math.floor(k / 3)) * 9 + (b % 3) * 3 + (k % 3);
        cells.push(cell(i));
      }
      boxes.push({ cells });
    }
    return { boxes };
  }
}
</script>
</body>
</html>
